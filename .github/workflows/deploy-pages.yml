name: Deploy Diqto Voice frozen export

on:
  workflow_dispatch:
    inputs:
      payload_sha:
        description: Immutable data-only export commit (40 hex)
        required: true
        type: string
      manifest_sha256:
        description: Reviewed manifest SHA-256 (64 hex)
        required: true
        type: string
      source_sha:
        description: Reviewed source commit (40 hex)
        required: true
        type: string
      file_count:
        description: Exact reviewed file count
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed transport
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate immutable inputs before checkout
        env:
          PAYLOAD: ${{ inputs.payload_sha }}
          SOURCE: ${{ inputs.source_sha }}
          MANIFEST: ${{ inputs.manifest_sha256 }}
          COUNT: ${{ inputs.file_count }}
        run: |
          python3 - <<'PY'
          import os, re
          for name, pattern in [('PAYLOAD', r'[a-f0-9]{40}'), ('SOURCE', r'[a-f0-9]{40}'), ('MANIFEST', r'[a-f0-9]{64}'), ('COUNT', r'[1-9][0-9]*')]:
              assert re.fullmatch(pattern, os.environ[name]), 'Invalid frozen-export input: ' + name
          PY
      - name: Checkout frozen bytes (never build)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.payload_sha }}
          path: payload
          persist-credentials: false
      - name: Verify complete manifest immediately before upload
        env:
          SOURCE: ${{ inputs.source_sha }}
          MANIFEST: ${{ inputs.manifest_sha256 }}
          COUNT: ${{ inputs.file_count }}
        run: python3 scripts/frozen-export.py payload/site payload/manifest.json "$MANIFEST" "$SOURCE" "$COUNT"
      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: payload/site
          retention-days: 1
  deploy:
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified frozen export
        id: deployment
        uses: actions/deploy-pages@v4
# IndexNow is deliberately separate: public readback must pass first, then changed URLs only.
